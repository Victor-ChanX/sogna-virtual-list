name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is excluded on purpose — see the `node18-compat` job.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run pack:dry-run

  node18-compat:
    # `engines` advertises Node >= 18, so installing, typechecking and building
    # the package on Node 18 has to keep working. The test suite is excluded:
    # jsdom 27 pulls in a dependency that `require()`s an ES module, which
    # needs the `require(ESM)` support added in Node 20.19 / 22.12 — a
    # limitation of the test environment, not of the published package (which
    # has no runtime dependency beyond React).
    name: node 18 install + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run pack:dry-run

  react18:
    name: react 18 peer range
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The peer range advertises React 18 as supported, so it has to be
      # exercised — the dev dependencies pin React 19.
      - name: Install React 18
        run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - name: Test
        run: npm run test
